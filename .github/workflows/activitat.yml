name: Activitat usuaris

# Diagnòstic sota demanda: recomptes d'activitat (comptes amb sessió i amb exercici,
# per finestres i per setmanes, i els comptes nous de cada setmana i si tornen).
# Cap fila per persona: el log és públic. Només lectura, no envia ni modifica res.
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instal·la dependències
        run: npm ci
        working-directory: scripts
      - name: Llista activitat
        run: node list_activitat.cjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
